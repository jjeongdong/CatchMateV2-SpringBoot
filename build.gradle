plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.back'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Actuator & Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Persistence
    runtimeOnly 'com.mysql:mysql-connector-j'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.25.60')
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:regions'
    implementation 'software.amazon.awssdk:s3'

    // FCM
    implementation 'com.google.firebase:firebase-admin:9.3.0'

    // Spring AI (RAG: OpenAI chat(gpt-4.1) + embedding(text-embedding-3-small))
    // 1.0.x 라인이 Spring Boot 3.4.x 호환 (1.1.x 는 3.5.x 필요)
    implementation platform('org.springframework.ai:spring-ai-bom:1.0.9')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-vector-store'  // SimpleVectorStore(인메모리). 운영 Redis 전환 시 starter 교체

    // Retry & JSON
    implementation 'org.springframework.retry:spring-retry'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport   // 테스트가 실패해도 실행분까지의 리포트는 생성된다
}

// ── 테스트 커버리지 (JaCoCo) ──────────────────────────────────────────
// 리포트: build/reports/jacoco/test/html/index.html (XML: .../jacocoTestReport.xml)
//
// 전체 실행:      ./gradlew test jacocoTestReport
// 컨텍스트 한정:  ./gradlew test --tests "com.back.catchmate.enroll.*" jacocoTestReport
//   (필터 실행 시 리포트는 '그 테스트가 커버한 범위'만 반영한다)
//
// ⚠️ 수치를 인용할 땐 아래 제외 목록을 함께 밝힌다. 제외는 '로직이 없어 테스트 대상이 아닌 것'
//    으로 한정했고, 판단이 갈릴 수 있는 Controller·FetchAdapter 는 **제외하지 않았다**
//    (얇은 위임이라 미커버로 잡히지만, 숫자를 부풀리지 않기 위해 남겨둔다).
jacoco {
    toolVersion = '0.8.12'   // Java 21 지원
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true      // CI·뱃지 연동용
        csv.required = false
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: [
            '**/Q[A-Z]*.class',        // QueryDSL 생성 클래스
            '**/CatchmateApplication.class',
            '**/config/**',            // 빈 설정 (global/config, 각 컨텍스트 Config)
            '**/dto/**',               // Command/Response/View record (필드 복사)
            '**/entity/**',            // JPA 엔티티 (매핑 전용)
            '**/port/**',              // 포트 인터페이스
        ])
    }))
}

// ── 아키텍처 검증 게이트 ──────────────────────────────────────────────
// 규칙 SSOT 는 .claude/hooks/posttooluse-validate-arch.py (Claude 편집 시 PostToolUse 훅과
// 동일 로직). --scan 배치 모드로 src/main/java 전체를 검사해 사람·CI 도 동일하게 게이트한다.
// python3 미설치 환경에선 빌드를 깨지 않고 경고 후 스킵, 위반 발견 시에만 실패.
def findPython = {
    for (exe in ['python3', 'python']) {
        try {
            if (['sh', '-c', "command -v ${exe}"].execute().waitFor() == 0) return exe
        } catch (ignored) {}
    }
    return null
}

tasks.register('archCheck') {
    group = 'verification'
    description = '헥사고날 의존성·0-import 규칙 검사 (.claude/hooks SSOT)'
    doLast {
        def script = file('.claude/hooks/posttooluse-validate-arch.py')
        if (!script.exists()) {
            logger.warn('[archCheck] 검증 스크립트 없음, 건너뜀: ' + script)
            return
        }
        def python = findPython()
        if (python == null) {
            logger.warn('[archCheck] python3 미발견 — 아키텍처 검사 건너뜀. CI 환경엔 python 설치 권장.')
            return
        }
        def result = exec {
            commandLine python, script.absolutePath, '--scan'
            environment 'CLAUDE_PROJECT_DIR', projectDir.absolutePath
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException(
                '아키텍처 규칙 위반 발견 (위 로그 참조). 수정 후 다시 빌드하세요. SSOT: .claude/ondemand-rules/*')
        }
    }
}

tasks.named('check') { dependsOn 'archCheck' }

bootJar { enabled = true }
jar { enabled = false }
